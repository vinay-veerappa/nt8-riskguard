# ACTIVE since 2026-08-13. It sat parked at ci/github-workflow-ci.yml for a day
# because the `gh` OAuth token lacks the `workflow` scope, and GitHub refuses any
# HTTPS push that writes under .github/workflows/ without it. Fixed by pushing over
# SSH instead, which is not an OAuth App push -- see the handover, section 5.11.
#
# Every step here is a gate that has been seen to fail. If you add one, make it
# fail on purpose once before you trust it.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # windows-latest, not ubuntu: NinjaTrader is Windows-only and the suite does
    # real filesystem work against Windows-shaped paths. Running it somewhere the
    # product can never run would only prove something about the runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Plan section 6, check 1: the core must never depend on the bridge.
      - name: Direction check
        run: python tools/check_direction.py

      # Plan section 6, check 2: exactly one copy of each addon source.
      - name: No stray addon copies
        run: python tools/check_no_stray_copies.py

      - name: Build
        run: dotnet build tests/RiskGuardTests.csproj -v q --nologo

      - name: Test
        run: dotnet run --project tests/RiskGuardTests.csproj --no-build

      # A surviving mutant means a test only looks like coverage. All three batteries
      # must report "SURVIVORS: none"; they exit non-zero otherwise, and they exit 2
      # on a non-green baseline rather than scoring every mutant KILLED against a
      # suite that was already red -- which is what they did until 2026-08-13.
      - name: Mutation battery CM3
        run: python mutation/mutate_cm3.py

      - name: Mutation battery CM4
        run: python mutation/mutate_cm4.py

      # Added when the workflow was activated: this battery arrived with P0-63 in
      # session 17, after the workflow was written and parked, so CI would otherwise
      # have been WEAKER than the local gate while looking complete.
      - name: Mutation battery P0-63
        run: python mutation/mutate_p0_63.py

# Plan section 6 also lists deploy parity (tools/sync_nt8.py --verify). It is NOT run
# here: it compares against %USERPROFILE%/Documents/NinjaTrader 8/, which exists only on
# the trading machine. A hosted runner has no NT8 install, so the check would either be
# skipped or pass vacuously -- and a green check that proves nothing is worse than an
# absent one. Run it locally before and after every deploy.
