# ACTIVE since 2026-08-13. It sat parked at ci/github-workflow-ci.yml for a day
# because the `gh` OAuth token lacks the `workflow` scope, and GitHub refuses any
# HTTPS push that writes under .github/workflows/ without it. Fixed by pushing over
# SSH instead, which is not an OAuth App push -- see the handover, section 5.11.
#
# Every step here is a gate that has been seen to fail. If you add one, make it
# fail on purpose once before you trust it.
#
# ⚠️ SHAPE, and why it is two jobs (changed 2026-08-14, session 37). This ran as ONE
# sequential job and took 1h56m. Measured from the first green run (31768033709):
# setup 32s, all eight source gates + build + suite 42s, and the 24 mutation batteries
# 6880s -- so 99% of the wall clock was mutation, and none of it was the tests. The
# 1328 tests execute in 20s here (5.3s locally). Each of the 263 mutants rewrites a C#
# source file and therefore needs a real recompile: 263 mutants plus a baseline and a
# restore run per battery is 311 `dotnet build` + `dotnet run` cycles at ~22s each.
# There is no way to make a C# mutant cheap without an in-process compiler.
#
# But they are 24 INDEPENDENT batteries, so they fan out. The reason this could not be
# done locally is that every battery rewrites the SAME shared source files in place --
# two running side by side in one working tree corrupt each other, which is exactly how
# a killed batch left a live `mutate_cm4` mutant in TradeCopierEngine.cs on 2026-08-14.
# A matrix gives every battery its OWN CHECKOUT, so the hazard disappears rather than
# being managed. MEASURED over the first two sharded runs: 15m36s (31774605782) and
# 11m48s (31775541688), both all-green. Quote the RANGE, not either number -- the 4-minute
# spread is runner availability and it is not controllable from here.
#
# ⚠️ THE SENTENCE ABOVE IS NO LONGER TRUE AS WRITTEN, and is kept because the reasoning
# still is (session 47, 2026-08-16). Batteries are now PACKED, so a bin's 1-2 batteries
# share one checkout and the hazard is MANAGED rather than absent: they run SEQUENTIALLY,
# and the run step asserts the tree is clean between them and stops the bin if it is not.
# Concurrent batteries in one tree remain forbidden; sequential ones in one tree have the
# same guarantee a local sequential run has, PROVIDED each reaches its restore line -- and
# none of them has a try/finally, which is why that assertion had to be written down.
#
# ⚠️ RE-MEASURED 2026-08-15 (session 45), run 31911413509, at 33 batteries. The band above
# was measured at 24 and is now STALE ON THE LOW END -- adding batteries adds queue, not
# just compute, and the header's own instruction is to re-measure whenever one is added:
#
#   wall clock            16m36s        (was quoted 11m48s-15m36s at 24 batteries)
#   jobs                  34            = 1 checks + 33 batteries
#   checks job            96s
#   battery compute SUM   11,395s       (189.9 min)
#   QUEUED                20 of 33      worst wait 375s, i.e. 6.25 min behind a slot
#   longest battery       UI4 609s      (P2-107 591s, UI3 528s, UI2 524s close behind)
#   per-job overhead      31s           checkout 5s + setup-dotnet 25s + setup-python 0s
#
# ⚠️ THE FLOOR IS NOT THE LONGEST BATTERY ANY MORE, IT IS total_compute / SLOTS. With 33
# jobs against ~20 concurrent slots, 20 of them wait. checks + UI4 = 11.8 min is the
# floor only if nothing queues; the real floor is 11,395s / 20 + checks = ~11.4 min.
# So ~5 of the 16.5 minutes is pure queueing, and it grows with every battery added.
#
# ⚠️ AND THE SLOTS ARE ACCOUNT-WIDE, NOT REPO-WIDE. `nt8-mcp-bridge` CI was running
# against the same allowance today. A run that looks slow may be contending with the
# sibling repo, which is invisible from inside this workflow -- check both before
# concluding anything about this one.
#
# ⚠️ AND THE TESTS ARE NO LONGER THE CHEAP HALF. The note above says "none of it was the
# tests", measured when the suite was 1328 tests / 5.3s locally. Measured now at 1774
# tests: `dotnet build` 4.4s, `--no-restore` 3.6s, and the TEST RUN 6.4s -- the suite is
# now the LARGER half of every mutant cycle. Any future attempt to make this faster
# should attack the suite's own runtime first; "the tests are not the problem" is a
# statement with a date on it.
#
# That is 7.4x, and it is SLOWER than the 10 min the arithmetic predicted (setup + UI4's
# 553s). Two things the sequential timings could not show: every battery runs 10-20%
# slower as one of 24 concurrent jobs (UI4 553s -> 618s), and runner PROVISIONING is not
# free -- 24 Windows runners do not all start at once, which is most of the gap. Total
# compute went UP, 6957s -> 8723s, because per-job setup is now paid 25 times. All of it
# is free on a public repo, but do not read the fan-out as costing nothing.
#
# The matrix is ordered LONGEST FIRST on purpose: the free plan runs 20 jobs at once and
# there are 24, so four queue. Starting the long ones first means the four that wait are
# the short ones, and they finish inside UI4's window instead of extending past it.
#
# ⚠️ PACKED 2026-08-16 (session 47), and ordering is no longer the lever -- COUNT is.
# 33 batteries against ~20 slots meant 13 waited no matter what order they started in, so
# ordering could only choose WHICH ones queued. They are now bin-packed into exactly 20
# jobs by tools/pack_ci_matrix.py on the seconds measured in run 31914385667, the first run
# after the clock-injection speedup (weights from before it are unusable -- batteries with
# more mutants shrank more, so packing on them yields a plan that looks balanced and is not).
#
#   before (33 shards, run 31914385667)   13m25s wall, 10,044s job time, 13 of 33 QUEUED
#   after  (20 bins,   run 31922684732)   10m59s wall,  9,178s job time,  0 of 20 queued
#
# MEASURED, not predicted -- the plan said ~10.6 min and the run came in at 10m59s. Every
# bin started within 3-6s of `checks` finishing, where 13 used to wait up to 375s. Two
# separate savings: the queue is gone, and per-job setup is paid 20 times instead of 33
# (866s less job time). ⚠️ AND THIS IS A FLOOR, NOT A TARGET: the whole run is now one
# battery long. UI4 measured 505s of work in a 551s bin -- checks 97s + UI4 551s is 10.8
# of the 10.99 minutes, and no packing splits a battery. The next real gain has to come
# from UI4 itself or from the suite each mutant re-runs, NOT from re-binning; re-running
# the packer against a different bin count cannot move this number.
#
# Re-pack after any battery is added: the tool refuses to run on guessed weights, and the
# run step prints BATTERY_SECONDS per battery because `gh run view` can no longer see
# inside a bin. Verified present for all 33 in the run above -- without them the next
# re-measure has no weights and the packer correctly refuses, so this is the line that
# keeps packing from being a one-way door.
#
# ⚠️ RE-PACKED 2026-08-16 (session 48) TO 19 BINS, AND THE BIN COUNT IS NOT THE REASON THE
# LAST RUN WAS SLOW. Two changes were made on top of the 20-bin plan above and both were
# wrong, in opposite directions:
#
#   1. mutate_p227.py was hand-packed into the CM3 bin on the GUESS "<=180s lands free".
#      It measured 271s, the bin ran 636s against a 429s ideal, and it alone became the
#      critical path: 726s wall. A guessed weight is not a weight -- pack_ci_matrix.py
#      refuses to run on one, and hand-editing the matrix is how you get around a refusal
#      you should have listened to.
#   2. It was then split into a 21st bin, which measured WORSE: 853s.
#
# ⚠️ AND THE 21st BIN IS NOT WHY. The concurrency limit is 20 jobs ACCOUNT-WIDE, SHARED
# ACROSS EVERY REPO -- which THIS FILE ALREADY SAID, sixty lines up, in the block added in
# session 45 that begins "AND THE SLOTS ARE ACCOUNT-WIDE, NOT REPO-WIDE". It was written
# down, it was correct, and the very next person to reason about slot count (me) still
# counted only this workflow's jobs. A fact recorded in prose beside the thing it governs
# is not a constraint; the packer's `--bins` had no idea, so nothing could refuse the plan.
# That is the general shape: WHERE A NUMBER IS ENFORCED IS NOT WHERE IT IS DOCUMENTED.
# Both repos were pushed together, so the ledger was 21 riskguard bins + 1 nt8-mcp-bridge
# job = 22 against 20. Measured on run 31929912836, and the timestamps are a causal chain,
# not a correlation:
#
#   05:51:00  19 bins start; 2 do not
#   05:56:01  the BRIDGE's only job ends
#   05:56:02  P2-107 starts        <- 1s after a slot in ANOTHER REPO freed
#   05:56:13  the P2-27 bin ends
#   05:56:14  P1-85+P1-83 starts   <- 314s late, and it is the critical path at 446s
#
# So a sibling repo's CI can silently add 5 minutes here, and nothing in this file could
# have told you: the queue is invisible from inside the run that is waiting.
#
# 19 bins is chosen so that ONE SLOT IS ALWAYS FREE for the other repo. It costs nothing:
# UI4 is 493s of work and the ideal bin at 19 is 451s, so UI4 is the floor at 17, 18, 19
# AND 20 bins -- all four plans predict the same ~10.3 min. Between plans that tie on the
# metric, take the one that does not depend on what another repository is doing.
#
# ⚠️ Do not "optimise" this back to 20. The gain is zero and the failure it re-admits is
# the one above, which presents as an unexplained 2-minute regression in an unrelated push.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Everything that is not a mutation battery. ~75s including setup, and the mutation
  # matrix waits on it: a battery refuses to run against a red baseline (exit 2) rather
  # than score every mutant KILLED on pre-existing failures, so 24 jobs discovering that
  # separately would report one broken suite 24 times. One job says it once.
  checks:
    # windows-latest, not ubuntu: NinjaTrader is Windows-only and the suite does
    # real filesystem work against Windows-shaped paths. Running it somewhere the
    # product can never run would only prove something about the runner.
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 -- check_version_matches_tag.py needs TAGS, and the default
      # shallow checkout has none. It FAILS rather than skips when it cannot see one,
      # so a shallow clone would break the build instead of quietly proving nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Plan section 6, check 1: the core must never depend on the bridge.
      - name: Direction check
        run: python tools/check_direction.py

      # Plan section 6, check 2: exactly one copy of each addon source.
      - name: No stray addon copies
        run: python tools/check_no_stray_copies.py

      # The version an operator reads off the live box must be the release that is
      # deployed. On 2026-08-13 the constant said 1.1.0 while v1.2.0 was tagged, deployed
      # and compiled -- the same "a report must match what it describes" defect as P0-68
      # and P1-70, in a version string.
      - name: Addon version matches the release tag
        run: python tools/check_version_matches_tag.py

      # Cheap, and it exists because the block below was left incomplete twice. Since the
      # batteries moved into a matrix it also insists each one appears as a real matrix
      # ENTRY -- a filename inside a YAML comment would otherwise satisfy a substring
      # check while running nothing, which is this repo's own recurring defect.
      - name: Every mutation battery is wired into this workflow
        run: python tools/check_ci_runs_every_battery.py

      # ...and a battery that IS wired in must be able to pass. Two batteries described a
      # mutant as "Expected to SURVIVE" -- correctly, with the reason no test can reach it --
      # and then exited 1 for it, so THIS WORKFLOW FAILED ON 10 CONSECUTIVE PUSHES ACROSS
      # THREE SESSIONS and nobody looked, because the answer was always the same. A gate that
      # cannot pass is not a gate; it trains its readers to skip the one signal checking 24
      # batteries, 263 anchors and 1328 tests. Fails in both directions: a declared survivor
      # needs `_battery.finish`, and a battery without one must keep the plain exit.
      - name: A declared EXPECTED SURVIVOR does not make a battery unpassable
        run: python tools/check_expected_survivors.py

      # ...and a battery that is wired in and can pass must also be able to RUN TO ITS RESTORE
      # LINE. Two encoding hazards, opposite directions, both Windows-only:
      #
      #   DECODE -- subprocess.run(capture_output=True, text=True) uses the LOCALE codec (cp1252
      #     here and on the runners). One non-ASCII character in a test name makes stdout None and
      #     the battery dies before its first mutant.
      #   ENCODE -- the battery's own print(). One non-ASCII character in a MUTANT DESCRIPTION
      #     raises UnicodeEncodeError AFTER a mutant is applied and BEFORE it is restored, leaving
      #     A LIVE MUTANT in the working tree.
      #
      # ⚠️ This gate existed in nt8-mcp-bridge and NOT HERE, while the handover cited it as
      # protecting these batteries -- the fourth per-repo gate gap. On being ported it failed 56
      # subprocess captures across 29 batteries: this repo had never pinned either half and had
      # only survived because the C# suite's output happens to be ASCII today. The encode half
      # then fired for real in CI on mutate_p182.py (P2-114).
      - name: Every mutation battery pins BOTH encodings and can reach its restore line
        run: python tools/check_batteries_pin_encoding.py

      # P2-24's class, made mechanical. Safety machinery that is written and never called
      # passes every other gate here -- it compiles, its own tests call it directly so the
      # suite is green, and the config surface advertising it looks configured. Session 34
      # produced three instances of it (StartAuditTimer, RunCopierPreflight,
      # ReconcileFollowerPosition) in the same pass that CLOSED P2-24 by deleting a fourth.
      # The worst of them shipped `AuditIntervalSeconds: 10` into the live config describing
      # a ten-second audit that never ran.
      - name: No dead safety machinery
        run: python tools/check_no_dead_safety_machinery.py

      # TradeCopierWindow.cs is one 1100-line `#if !TESTING` block, so the Build and Test
      # steps below compile it to NOTHING -- a stray brace there passes every other gate
      # in this file and is first reported by NinjaTrader, where a compile error in ANY
      # addon .cs stops EVERY addon loading, RiskGuard included. This is a PARSER check
      # only (CS1xxx); it is not a compile and does not replace NT8's. Watched failing on
      # a deliberately removed semicolon before being added here.
      - name: Code the test build compiles away still parses
        run: python tools/check_window_parses.py

      # The ordering blocks a session reads before choosing what to work on had been
      # carrying SIX closed IDs -- P2-95, P2-93 and P2-94 (all closed in session 34) and
      # the three P?- UI write items -- because each session wrote its list by copying the
      # previous one and striking only the item it had just closed. Closures propagated
      # forward into the record and never backwards into the ordering, so nine sessions
      # were told to "weigh P2-95 first". This also requires every plan entry to CARRY a
      # status token, which is the half that would rot: 14 carried none, including the
      # whole P0-1...P0-8 block. Watched failing on all four breaks before being added.
      - name: Ordering lists name only open defects
        run: python tools/check_next_list_ids.py

      - name: Build
        run: dotnet build tests/RiskGuardTests.csproj -v q --nologo

      - name: Test
        run: dotnet run --project tests/RiskGuardTests.csproj --no-build

      # ⚠️ RUN BEFORE THE BATTERIES, and it takes a second. A battery whose find-string no
      # longer matches prints [SKIP] and scores that mutant a SURVIVOR -- but only when the
      # battery is RUN, and a battery only runs when the suite is green. So an anchor broken
      # by an unrelated commit is invisible for as long as nobody notices. That has happened
      # twice: mutate_ui2's anchor was broken by the UI7 commit and stayed broken through
      # a whole session because only the battery that "looked touched" was re-run, and
      # mutate_cm3's two were broken by P1-85 and caught by this check on the same day.
      #
      # It is a substring count, so it costs nothing and works even while the suite is red
      # -- which is exactly when a mutation battery cannot tell you anything. It lives in
      # THIS job, not the matrix, so one broken anchor is reported once and before 24
      # runners spend ten minutes each.
      - name: Mutation anchors still match
        run: python mutation/check_anchors.py

  # A surviving mutant means a test only looks like coverage. EVERY battery must report
  # "SURVIVORS: none" -- or, since session 36, exactly the survivors it DECLARES with an
  # `EXPECTED SURVIVOR:` prefix and no others. They exit 2 on a non-green baseline rather
  # than scoring every mutant KILLED against a suite that was already red, which is what
  # they did until 2026-08-13.
  #
  # When you add a battery, add it to the matrix below IN THE SAME COMMIT. This has been
  # got wrong twice (P0-63's, then session 20's two), each time leaving CI weaker than the
  # local gate while looking complete; `check_ci_runs_every_battery.py` in the job above
  # is what makes that mechanical.
  mutation:
    name: ${{ matrix.label }}
    needs: checks
    runs-on: windows-latest
    strategy:
      # ⚠️ NOT fail-fast. The default cancels every other battery the moment one fails,
      # which would hide a survivor in battery 20 behind a survivor in battery 2 and turn
      # a full mutation report into a one-at-a-time bisect across 24 pushes. Each battery
      # is an independent question; answer all of them every time.
      fail-fast: false
      matrix:
        include:
          # ⚠️ GENERATED BY tools/pack_ci_matrix.py -- do not hand-balance these bins.
          #   python tools/pack_ci_matrix.py --times run_times.tsv --bins 19 --apply
          # where run_times.tsv is
          #   gh run view <id> --json jobs --jq '.jobs[] | [.name,.startedAt,.completedAt] | @tsv'
          #
          # 33 batteries in 20 jobs, packed longest-first on the seconds MEASURED in run
          # 31914385667 (the first run after the clock-injection speedup; earlier weights are
          # not usable, because batteries with more mutants shrank more). The tool refuses to
          # pack without measured times and strips the 31s of per-job setup from each one
          # first -- a packed bin pays that once, not once per battery.
          #
          # ⚠️ THE BIN TOTALS BELOW ARE WORK, NOT JOB DURATION: add 31s of setup. And the
          # decomposition after each `=` exists because once packed, `gh run view` reports the
          # BIN's time and not each battery's -- the run step prints a BATTERY_SECONDS line per
          # battery so the next re-measure still has weights. Without one of those two, this
          # change is a one-way door.
          #
          # ⚠️ 20 BINS IS THE SLOT COUNT, MEASURED, not a round number: in run 31914385667
          # exactly 20 jobs started in the first wave and 13 waited. Past the slot count another
          # job is not another runner, it is another wait -- which is why 33 shards were SLOWER
          # than 20 packed bins despite identical compute.
          #
          # ⚠️ UI4 IS THE FLOOR at 508s of work. No packing splits a battery, so ~10.6 min is
          # the best this shape can do; going below it means splitting UI4, not re-binning.
          # UI4 (the producer), 553s. UI3's battery proved the REGISTRY honest; this one proves
          # the BUILDER cannot take that honesty back, which is a different job -- every guarantee
          # UI3 bought is now mediated by one method. Same asymmetry: every mutant makes the
          # snapshot more reassuring than the box. Three survived the first run and each said
          # something different: a field never observed being false (IsArmed), a fix applied to
          # only one of two identical accessors, and an UNREACHABLE fallback that was deleted
          # rather than pinned -- see the note beside that mutant before adding a defensive branch.
          - { label: "UI4", batteries: "mutate_ui4.py" }   # 493s = UI4 493s

          # P1-85, 263s. The copier must not invent an account when a request omits one. Most of the
          # interesting ways to get this wrong still LOOK like a refusal, which is what the battery is
          # for: mutant 5 tests for null instead of blank (every test that OMITS an account still
          # passes, because omitted and blank are different inputs -- the review panel found that one,
          # not the suite), mutant 7 refuses without a reason, and mutant 8 puts the load-path skip
          # back on Console.WriteLine so config shrinks at startup with nothing in the guard log.
          # P1-83, 176s. Config that is stored, settable, and read by nothing. The gate is a class
          # gate: it walks the two copier DTOs by reflection and counts real uses in the ENGINE,
          # excluding the declaration, `X = something.X` clone/serialize lines, and the field-name
          # string list. Scoping it to the engine is the whole design -- scanning the window too would
          # score StealthMode as READ, because the window printed "Stealth: ON" for a feature with no
          # implementation, which is the worst form of the defect rather than an absolution from it.
          # UI5 (the JSON contract), 245s. Fifteen lines of serializer settings, batteried because the
          # route that serves the payload is UNTESTABLE (P2-27) and the settings are exactly what a
          # future tidy-up would change. Dropping the enum converter couples the page to an enum order
          # that exists for sorting; NullValueHandling.Ignore turns "no limit" into a limit of zero,
          # which is UI1's bare-zero defect one layer out.
          # P1-99, new in session 37 -- placed second on measured-length grounds once it has a
          # timing of its own; until then it sits high because it is a copy-path battery and those
          # run long. The copier sized each leader EXECUTION independently, so a 100-lot order
          # filling 20 x 5 copied NOTHING -- leader long 100, follower FLAT, twenty routine
          # COPY_SKIPPED_SUB_MINIMUM lines and no error. Mutant 2 is the one to know: it is THE
          # WRONG FIX (floor each slice's delta at 1), which stops the drops and turns the same
          # order into a TWENTY-contract copy. Mutant 4 pins the asymmetry -- exits already mirror
          # the follower's real position and must NOT acquire the accumulator.
          - { label: "P1-85+UI5", batteries: "mutate_p185.py mutate_ui5.py" }   # 483s = P1-85 250s + UI5 233s

          # P0-67, 283s. This and P1-71 additionally score a CRASH -- no result line in the runner's
          # output -- as a KILL. The older three do not, and a mutant that killed the runner was
          # scored a SURVIVOR because of it.
          # P0-63, 200s. Arrived in session 17 after this workflow was written and parked, so CI
          # would otherwise have been WEAKER than the local gate while looking complete.
          # P1-71, 245s. Scores a crash as a kill; see P0-67 above.
          # P1-84, 219s. Three defaults that made the guard easier to switch off than to live with.
          # A battery over three literals looks like overkill until you notice that none of the tests
          # pins a number: one asserts an inequality between two files, one is conditional on a
          # neighbouring field, one reads the addon source. Mutant 6 raises the copier cap to ONE
          # above the guard's, which is what proves the first is an inequality and not a pinned 10.
          # Mutant 3 -- changing OnMissing to AutoStop -- SURVIVED the first run against 1180 green
          # tests, and that survival is how P1-87 was found.
          - { label: "P0-67+P1-71", batteries: "mutate_p0_67.py mutate_p1_71.py" }   # 481s = P0-67 250s + P1-71 231s

          # UI7 -- a refusal that says why, 265s. Every mutant here still REFUSES the write, so the
          # P1-76 tests stay green through all of them; what breaks is the operator's ability to find
          # out what to change. Two of the ten mutate TradeCopierWindow.cs instead of the engine,
          # putting a surface back on the reason-losing overload -- that file is entirely
          # `#if !TESTING`, so a source scan is the only gate there is and it has to be proven to
          # fire. One survived the first run: the accepted-write test covered the relationship half
          # and not the group half, the same one-sided shape as P1-69 and P1-75.
          # P2-112, ~215s. The 5-second ATM sweep that moves breakeven stops returned early forever
          # when Application.Current had no Dispatcher -- P1-13's fail-open at a subsystem P1-13
          # never inspected, found only when P2-29 widened that gate to the whole addon tree.
          # Mutants sit on three axes: do the work, do it ONCE, and say so ONCE. Mutant 2 is the one
          # to know and it changes no production behaviour at all -- it puts the control flow back
          # behind `#if TESTING`, which is how this survived: the branch holding the defect existed
          # in NO test build, so the ten ATM tests drove a body the shipped assembly does not
          # contain. Mutant 7 is the review panel's one correct finding of three. Mutant 9 is a
          # DECLARED survivor: it rewrites the `#else` body, which no test build compiles.
          - { label: "UI7+P1-99", batteries: "mutate_ui7.py mutate_p199.py" }   # 465s = UI7 258s + P1-99 207s

          # P2-108, ~200s. The FSM audit's findings were LogEvents with no action behind them, so
          # nothing bounded them. MEASURED on the box under Market Replay: NAKED_POSITION at
          # 3/6/9/12 over 30/60/90/120s -- one per 10s indefinitely -- with ACTION_SUPPRESSED 0
          # throughout, which is the proof P2-107's DispatchActions never sees this path.
          # Mutant 5 is the one to know: it never clears the record, so a finding suppressed once
          # stays suppressed for the life of the process. THE OPPOSITE DEFECT and the worse one --
          # an alarm that is permanently muted is as useless as one that never stops.
          - { label: "CM4+P2-112", batteries: "mutate_cm4.py mutate_p2112.py" }   # 465s = CM4 256s + P2-112 209s

          - { label: "CM3+P2-38", batteries: "mutate_cm3.py mutate_p238.py" }   # 462s = CM3 331s + P2-38 131s

          # P2-98, 327s. A partial fill delivers several Executions for the SAME Order object, and
          # the pending-copy entry was consumed on the first of them: the metric described the
          # SMALLEST slice, and every later slice raised FILL_NOT_MEASURED naming a cause that was
          # not the cause. Mutant 6 is the one to know -- it keeps the fix and re-evaluates a
          # REJECTED latency on the next slice, manufacturing a plausible figure out of the same
          # disagreeing clocks that produced the rejected one. Mutant 4 is the other: an unweighted
          # mean is this defect in a subtler form, a 1-lot counting for as much as the 9 beside it.
          # P1-100, new in session 37, and the SHORTEST battery here at 4 mutants -- placed last on
          # that basis until the first green run gives it a measured time. A SHADOW-only lockout
          # blocked real orders: the guard's own gate was right (P2-92), but the bridge's three
          # order paths ask IsAccountLocked, which returned the raw flag and had never been taught
          # about either shadow authority or lockout deadlines. Wrong in BOTH directions -- it
          # refused on an observation and admitted orders during a timed manual lockout. The fix is
          # one predicate with every reader calling it, so the two mutants you would expect here
          # (delete the authority clause; key it on the current mode) now live in mutate_p292.py,
          # whose anchors were REPOINTED at that predicate. check_anchors.py is what caught them
          # going stale, in the same commit that moved them.
          - { label: "P2-98+P0-96", batteries: "mutate_p298.py mutate_p096.py" }   # 461s = P2-98 328s + P0-96 133s

          # P1-82 / P1-86, 291s. A switch whose rule cannot fire must not default ON. The change is
          # four literals, which is precisely why it needs a battery: that is the size of diff that
          # gets half-applied, or reverted later by someone "restoring a sensible default". Each
          # default is stated TWICE -- property initializer and parser fallback -- and the parser
          # copy is the one that runs for every config file that predates the field, i.e. all of
          # them. Mutants 3 and 4 flip only that copy, which the class gate cannot see because it
          # builds its config with `new`.
          # P3-30's guard audit, 201s, and specifically its instrument matching. The audit shipped
          # keying its broker reads on Instrument.ToString() while every FSM in the addon is keyed on
          # Instrument.FullName, so nothing it looked up ever matched -- and the consequence was not
          # a missed finding but the opposite: a correctly protected account reporting NAKED_POSITION,
          # ORPHAN_STOP and FSM_DIVERGENCE every 10 seconds. The three tests it shipped with are all
          # POSITIVE-only and every one stays green under the defect, because a total matching failure
          # emits every event. Mutant 1 is the shipped defect and is killed only by the negative
          # "the audit is SILENT" test. Declares one EXPECTED SURVIVOR (the lock-scope mutant).
          - { label: "P1-82 / P1-86+P2-108", batteries: "mutate_p182.py mutate_p2108.py" }   # 458s = P1-82 / P1-86 265s + P2-108 193s

          # P1-76, 354s. Three of its fourteen mutants SURVIVED on the first run, including the
          # one that reinstates the pre-P1-76 emergent tie-break -- the precedence test was
          # decorative because direct-wins was over-determined.
          - { label: "P1-76+P1-100", batteries: "mutate_p1_76.py mutate_p1100.py" }   # 457s = P1-76 341s + P1-100 116s

          # P3-34's copier mode, 287s. Every mutant here is a way of writing code that looks like a
          # shadow mode and places real orders anyway. Mutant 3 is the one to know: it keeps the
          # gate and deletes the `continue`, so the copy is logged as suppressed and then submitted
          # -- P1-70's class, and the shape of the fix is entirely present for anyone skimming the
          # diff. Mutant 2 is P1-87's: an unrecognised mode must not fall through to the permissive
          # branch, because here the permissive branch trades.
          # P2-113, ~170s. The inventory reported PropFirm.LocalNewsEventsFilePath as read by
          # nothing -- 97 rows per poll, measured -- for two days after P2-25 gave it a loader.
          # F-9's class in the PESSIMISTIC direction, which is not the harmless one: a red row that
          # is wrong is how an operator learns to discount red rows. Group 1 restores the loader's
          # silence and group 2 stops the registry reporting what the loader learned. Mutant 3 is
          # the one to know: a well-formed EMPTY news file reporting as a healthy load, which is
          # the only one of the four failures that looks like a success at every other surface.
          - { label: "P3-34+P1-84", batteries: "mutate_p334.py mutate_p184.py" }   # 453s = P3-34 258s + P1-84 195s

          # UI1 (the conformance snapshot), 307s. Two of its twelve mutants SURVIVED on the first
          # run against a suite of 21 tests that were all green -- the short-leader path was
          # untested, and the clamp test asserted the FLAG rather than the VERDICT. A third was
          # RETIRED as unkillable by construction rather than weakened; the battery records why,
          # because "make the mutant die" is the wrong instinct when the mutant describes
          # something the platform cannot produce.
          # P2-101, new in session 38, 7 mutants -- unmeasured, sits beside P1-100 on that basis.
          # A shadow lockout retried its flatten forever: the retry's exit condition is "the
          # position is still open", and in shadow the flatten is never sent. ~12 log lines a
          # minute per account, on the FUNDED account too, burying interventions.jsonl. Mutant 2
          # is THE PARTIAL FIX -- one budget for every mode, which stops the unbounded growth and
          # still repeats an observation five more times than shadow needs. Mutant 7 is the other
          # half: the LOCKOUT_STUCK warning was keyed on an interval the retry itself reset every
          # 5s, so it could never fire, and killing that mutant took two attempts because any
          # sweep where the retry fires hides it. Declares one EXPECTED SURVIVOR.
          - { label: "UI1+P1-87", batteries: "mutate_ui1.py mutate_p187.py" }   # 450s = UI1 297s + P1-87 153s

          # P2-27, added 2026-08-16 (session 48). The shared guard-config value validator.
          # Eleven mutants, all killed on the first run.
          #
          # ⚠️ IT WAS PACKED INTO CM3 FIRST AND THAT WAS WRONG, measured rather than argued.
          # The estimate was "CM3 is the lightest bin at 325s and UI4's ~508s is the floor, so up
          # to ~180s lands free". BATTERY_SECONDS came back at 246s, so CM3+P2-27 ran 636s and
          # became the critical path on its own: run 31929291223 went 10m59s -> 12m06s, with the
          # next bin at 580s and UI4 at 536s. A guessed weight is not a weight -- the same lesson
          # pack_ci_matrix.py already refuses to pack without, applied one level up to a human
          # doing the packing by hand.
          #
          # ⚠️ THE SPLIT THAT FOLLOWED WAS ALSO WRONG, AND SO WAS THE ARGUMENT FOR IT. This
          # block used to read "AND IT DOES NOT FIT IN TWENTY BINS -- adding 246s to the
          # lightest bin available (CM3 325s, then F9 331s, then P1-76 348s) clears 536s every
          # time, so the FLOOR HAS MOVED". Both halves are false, and the reasoning error is
          # worth more than the conclusion: it asked where the new battery fits among the
          # EXISTING bins, when the bins are an output of the packer, not an input to it. A
          # full re-pack of all 34 puts P2-27 with P0-63 at 447s -- comfortably under UI4's
          # 493s, which was the floor before this battery existed and still is. The floor did
          # not move. Nothing was ever too big; the arrangement was just stale.
          #
          # The 21st bin then measured 853s against the 726s it was meant to fix, because a
          # 21st bin does not exist to be had -- see the ACCOUNT-WIDE slot ledger at the top
          # of this file. Now re-packed to 19, and this battery is unremarkable again.
          #
          # ⚠️ THE NEXT BATTERY ADDED NEEDS A REAL RE-PACK, not another hand-placed bin, and
          # not an argument about which bin has room. Pull fresh BATTERY_SECONDS for all 35
          # and run tools/pack_ci_matrix.py --times ... --bins 19 --apply.
          #
          # ⚠️ Three of the eleven are defects THIS TICKET SHIPPED before being caught, which is
          # the reason to read the list rather than the score: mutant 2 restores the spec's own
          # `disabled` (the COPIER's mode, accepted by a class built to stop exactly that, behind
          # 1792 green tests and two APPROVE(0) reviewers); mutant 3 restores the spec's
          # case-insensitive match, which preflight is not; mutant 9 restores a refusal that told
          # the operator to fix a case that was not the problem.
          # ⚠️ Mutant 7 is the one to know: an unconditional refusal. Every requirement in the
          # ticket is about refusing something, so it satisfies all of them and ships a validator
          # that makes the endpoint unusable -- P2-115's constant and F-17's always-refuse again.
          # The six ACCEPTANCE cases are the only thing that bans it.
          - { label: "P2-27+P0-63", batteries: "mutate_p227.py mutate_p0_63.py" }   # 447s = P2-27 271s + P0-63 176s

          # F-6, push alerts. The mutants split into LOUD and QUIET, and the QUIET ones are the
          # point: a budget that never refills, a floor that refuses everything, a severity table
          # that classifies nothing -- each of them passes every "the repeat was suppressed" test,
          # because suppression is exactly what those tests assert. They die only to the NEGATIVE
          # controls, which is why half the F-6 tests are negative controls (P3-30 shipped a
          # detector behind three positive-only acceptance tests that matched nothing at all).
          # Mutant 9 is the honesty one: dropping [WOULD] tells the operator by push notification
          # that an account was flattened while the guard was in shadow and touched nothing.
          # P1-87, 178s. An unrecognised StopGuard.OnMissing emitted NO ACTION for a position with no
          # stop. Found by mutate_p184's OnMissing mutant SURVIVING 1180 green tests, and a test in
          # that suite ASSERTED the defect as correct behaviour, so the suite was defending it rather
          # than merely silent about it. Mutant 2 is the one to know: it keeps the else branch and
          # makes it do nothing, so the shape of the fix survives and the behaviour does not.
          - { label: "F-6+P3-30", batteries: "mutate_f6.py mutate_p330.py" }   # 447s = F-6 268s + P3-30 179s

          # F-9, 288s. The firm-rule REPORTER must resolve the account's plan, as the ENFORCER has
          # since P1-42. Eleven mutants, and the two that matter most keep the resolved BRANCH and
          # report the TOP-LEVEL AMOUNT: every state assertion still passes, the row reads Enforcing
          # correctly, and the number beside it is a limit the operator is not held to. That is
          # P1-42's own lesson one layer out, and only the limit assertions see it. Two more restore
          # the defect proper -- and it was a defect in BOTH directions, because the real Take Profit
          # Trader profile has DailyLoss OFF, so the old reporter claimed a live rule that could not fire.
          - { label: "F9+P2-113", batteries: "mutate_f9.py mutate_p2113.py" }   # 446s = F9 279s + P2-113 167s

          # UI6 (the copier half), 311s. The mutant this battery exists for casts CopierConformance
          # to an int for sorting: that enum's numbering is HISTORICAL, not severity, so casting
          # puts a healthy Idle row first and an ORPHAN -- a live position nothing is managing --
          # below a quarantined one. Three survived the first run, all real gaps: an unrecognised
          # verdict was unreachable by the completeness test, and nothing asserted the ACTUAL
          # position or the quarantine reason survived serialization.
          # P2-38, ~180s. The sim/live classifier -- the ONE predicate deciding whether an account
          # can lose real money. It gates confirmLive on order placement, strategy deployment, and
          # T5's guarded-live-follower rule. ⚠️ NO BATTERY COVERED IT UNTIL SESSION 42: P2-38 was a
          # real defect in it (Name.StartsWith("Sim") exempted a funded "SimpsonFund") and its fix
          # shipped with tests and no mutants, so the riskiest predicate in the repo was the least
          # mutated. Added when Provider.Playback was folded in for Market Replay testing, because
          # widening a safety classifier is the direction P2-38 itself failed in.
          # Mutant 3 is the one to know: widened to "anything that is not NinjaTrader", so Rithmic
          # and InteractiveBrokers classify as simulated. EVERY POSITIVE ASSERTION STILL PASSES --
          # only the negative half catches it, and it fails 5 of them.
          - { label: "UI6+P1-83", batteries: "mutate_ui6.py mutate_p183.py" }   # 445s = UI6 290s + P1-83 155s

          # P2-92, 285s. Shadow mode must be observation-only. Eleven mutants, and the two worth
          # naming are the ones that look like the fix. Mutant 2 makes CanTrade consult the CURRENT
          # mode instead of the stored authority, which is only wrong because the mode at READ time
          # is not the mode at BREACH time -- an operator locked out in live then escapes by
          # switching to shadow, which is FR-30 / P1-4's bypass through a different setting. Mutants
          # 6 and 10 fail CLOSED, so they survive on safety rather than correctness and have to be
          # killed deliberately.
          # P0-96, 156s. The copier read a position's SIDE off the SIGN of its quantity, and NT8's
          # Position.Quantity is absolute -- the side is MarketPosition. So a leader COVERING A SHORT
          # sent the follower a Sell, which does not close a short, it DOUBLES it. 1300 green tests
          # did not see it, because every long-side test passes under the defect. Mutant 3 is the
          # other lesson: the exit-alignment block can be deleted outright and only a test with the
          # follower on the OPPOSITE side to the leader notices -- the one case the block exists for.
          # Declares one EXPECTED SURVIVOR (the reconciler mutant; unreachable until P2-27).
          - { label: "P2-92+P2-101", batteries: "mutate_p292.py mutate_p2101.py" }   # 444s = P2-92 274s + P2-101 170s

          # P2-107, new in session 40, 18 mutants -- unmeasured, sits beside P2-101 on that basis.
          # The same repeated-action family as P2-101, found on a DIFFERENT path in that fix's own
          # validation run: PEAK_GIVEBACK_BREACH re-emitting its flatten 7 times in ~20s,
          # per-evaluation so with no spacing at all. Two instances in one hour is why the
          # de-duplication moved to where actions LEAVE the guard (GuardActionDeduplicator behind
          # DispatchActions) instead of being written into each producer.
          #
          # ⚠️ Read the battery's second block before trusting a green here. The first THIRTEEN
          # mutants all died on the first run; five more, aimed at the parts none of them touched,
          # ALL SURVIVED -- including a revert of the AccountItemUpdate handler to its old bare
          # loop, i.e. the one path the defect was measured on walking around the entire
          # mechanism while eleven tests of that mechanism passed. That is P3-30's shape.
          - { label: "P2-107", batteries: "mutate_p2107.py" }   # 407s = P2-107 407s

          # UI3 (the guard rule inventory), 376s. Every mutant here makes the inventory MORE
          # REASSURING than the truth, because that is the only direction that can hurt anyone:
          # this registry exists to stop a config field lying about whether it protects anything,
          # so "it crashes" is not the failure mode -- "it reports ENFORCING for a rule that has
          # never been able to fire" is. Three survived the first run, all one gap (the evidence
          # count was asserted for 1 of 5 rules that use it); the fix opened an escape route, and
          # the mutant for THAT survived too. Read the file before adding to it.
          - { label: "UI3", batteries: "mutate_ui3.py" }   # 405s = UI3 405s

          # UI2 (one config owner; the window dispatches requests), 443s. The FIRST battery to
          # mutate two files: four of its mutants edit TradeCopierWindow.cs, whose whole body is
          # `#if !TESTING`, so the suite compiles it away and four acceptance tests read it as
          # TEXT instead. Those four mutants put each original defect back verbatim, because
          # "does the source-text check actually fail when the defect returns?" is the one
          # question a source-text check cannot answer about itself.
          - { label: "UI2", batteries: "mutate_ui2.py" }   # 402s = UI2 402s
    steps:
      # No fetch-depth here. Only check_version_matches_tag.py needs tags, and it runs in
      # the `checks` job; a shallow clone is what makes 24 checkouts cheap.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ⚠️ THE `git diff` BETWEEN BATTERIES IS THE LOAD-BEARING LINE, and it is here because
      # PACKING CREATED THE HAZARD IT GUARDS. A battery mutates shared .cs files in place and
      # restores them at the end -- with no try/finally (see mutate_ui4.py's tail). A battery
      # that dies mid-mutant therefore leaves a LIVE MUTANT in the tree. While every battery
      # had its own checkout that was contained inside one already-failing job; packed, the
      # next battery in the bin would compile against mutated source and report kills and
      # survivors that mean nothing -- and it would report them GREEN, because a mutant that
      # is already in the file is one the "unmutated" baseline also contains.
      #
      # This is the same class as the killed local batch that left a live mutate_cm4 mutant in
      # TradeCopierEngine.cs on 2026-08-14 -- found only because the suite dropped by two
      # tests. So: assert the tree is clean after each battery, and STOP the bin if it is not.
      # Stopping loses the remaining batteries' results, which is the correct trade: a missing
      # answer is recoverable and a false green is not.
      #
      # ⚠️ A battery that merely REPORTS SURVIVORS has completed and restored, so the loop
      # carries on and reports them all at the end. `fail-fast: false` above exists to stop one
      # failure hiding another, and aborting the bin on an ordinary survivor would reintroduce
      # exactly that inside every job.
      #
      # ⚠️ `--ignore-cr-at-eol` because THIS REPO'S BLOBS ARE CRLF and `core.autocrlf` is true
      # on the machine that writes them. Measured clean both ways locally -- but a local
      # worktree is not a fresh checkout, which is precisely how a battery scored 9/9 here and
      # 2/9 in CI (handover §5.66). The flag cannot cause a false PASS: a live mutant differs
      # by real text, never by carriage returns alone. It only removes the false FAIL, which
      # would otherwise abort all 19 bins on the environment difference rather than on a bug.
      #
      # ⚠️ BATTERY_SECONDS is what keeps this re-packable. Once batteries share a job,
      # `gh run view` reports the BIN's duration and per-battery weights are unrecoverable --
      # tools/pack_ci_matrix.py refuses to pack without them, so without this line the next
      # re-measure has nothing to read and the packing becomes a one-way door.
      - name: Mutation batteries ${{ matrix.label }}
        shell: bash
        run: |
          failed=""
          for b in ${{ matrix.batteries }}; do
            echo "::group::$b"
            start=$SECONDS
            if ! python "mutation/$b"; then failed="$failed $b"; fi
            echo "BATTERY_SECONDS $b $((SECONDS - start))"
            echo "::endgroup::"
            if ! git diff --ignore-cr-at-eol --quiet; then
              echo "::error::$b did not restore the tree -- A MUTANT IS LIVE."
              echo "Refusing to run the rest of this bin (${{ matrix.batteries }}):"
              echo "every result after this point would be measured against mutated source,"
              echo "and would look GREEN because the baseline would contain the mutant too."
              git diff --stat
              exit 2
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::battery failed in bin ${{ matrix.label }}:$failed"
            exit 1
          fi

# Plan section 6 also lists deploy parity (tools/sync_nt8.py --verify). It is NOT run
# here: it compares against %USERPROFILE%/Documents/NinjaTrader 8/, which exists only on
# the trading machine. A hosted runner has no NT8 install, so the check would either be
# skipped or pass vacuously -- and a green check that proves nothing is worse than an
# absent one. Run it locally before and after every deploy.
