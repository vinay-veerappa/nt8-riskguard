# ACTIVE since 2026-08-13. It sat parked at ci/github-workflow-ci.yml for a day
# because the `gh` OAuth token lacks the `workflow` scope, and GitHub refuses any
# HTTPS push that writes under .github/workflows/ without it. Fixed by pushing over
# SSH instead, which is not an OAuth App push -- see the handover, section 5.11.
#
# Every step here is a gate that has been seen to fail. If you add one, make it
# fail on purpose once before you trust it.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # windows-latest, not ubuntu: NinjaTrader is Windows-only and the suite does
    # real filesystem work against Windows-shaped paths. Running it somewhere the
    # product can never run would only prove something about the runner.
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 -- check_version_matches_tag.py needs TAGS, and the default
      # shallow checkout has none. It FAILS rather than skips when it cannot see one,
      # so a shallow clone would break the build instead of quietly proving nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Plan section 6, check 1: the core must never depend on the bridge.
      - name: Direction check
        run: python tools/check_direction.py

      # Plan section 6, check 2: exactly one copy of each addon source.
      - name: No stray addon copies
        run: python tools/check_no_stray_copies.py

      # The version an operator reads off the live box must be the release that is
      # deployed. On 2026-08-13 the constant said 1.1.0 while v1.2.0 was tagged, deployed
      # and compiled -- the same "a report must match what it describes" defect as P0-68
      # and P1-70, in a version string.
      - name: Addon version matches the release tag
        run: python tools/check_version_matches_tag.py

      # Cheap, and it exists because the block below was left incomplete twice.
      - name: Every mutation battery is wired into this workflow
        run: python tools/check_ci_runs_every_battery.py

      # TradeCopierWindow.cs is one 1100-line `#if !TESTING` block, so the Build and Test
      # steps below compile it to NOTHING -- a stray brace there passes every other gate
      # in this file and is first reported by NinjaTrader, where a compile error in ANY
      # addon .cs stops EVERY addon loading, RiskGuard included. This is a PARSER check
      # only (CS1xxx); it is not a compile and does not replace NT8's. Watched failing on
      # a deliberately removed semicolon before being added here.
      - name: Code the test build compiles away still parses
        run: python tools/check_window_parses.py

      - name: Build
        run: dotnet build tests/RiskGuardTests.csproj -v q --nologo

      - name: Test
        run: dotnet run --project tests/RiskGuardTests.csproj --no-build

      # A surviving mutant means a test only looks like coverage. EVERY battery here
      # must report "SURVIVORS: none"; they exit non-zero otherwise, and they exit 2
      # on a non-green baseline rather than scoring every mutant KILLED against a
      # suite that was already red -- which is what they did until 2026-08-13.
      #
      # When you add a battery, add it HERE in the same commit. This has now been got
      # wrong twice (P0-63's, then session 20's two), each time leaving CI weaker than
      # the local gate while looking complete.

      # ⚠️ RUN FIRST, and it takes a second. A battery whose find-string no longer matches
      # prints [SKIP] and scores that mutant a SURVIVOR -- but only when the battery is
      # RUN, and a battery only runs when the suite is green. So an anchor broken by an
      # unrelated commit is invisible for as long as nobody notices. That has happened
      # twice: mutate_ui2's anchor was broken by the UI7 commit and stayed broken through
      # a whole session because only the battery that "looked touched" was re-run, and
      # mutate_cm3's two were broken by P1-85 and caught by this check on the same day.
      #
      # It is a substring count, so it costs nothing and works even while the suite is red
      # -- which is exactly when a mutation battery cannot tell you anything.
      - name: Mutation anchors still match
        run: python mutation/check_anchors.py

      - name: Mutation battery CM3
        run: python mutation/mutate_cm3.py

      - name: Mutation battery CM4
        run: python mutation/mutate_cm4.py

      # Added when the workflow was activated: this battery arrived with P0-63 in
      # session 17, after the workflow was written and parked, so CI would otherwise
      # have been WEAKER than the local gate while looking complete.
      - name: Mutation battery P0-63
        run: python mutation/mutate_p0_63.py

      # Session 20 (P1-71, P0-67). These two additionally score a CRASH -- no result
      # line in the runner's output -- as a KILL. The older three do not, and a mutant
      # that killed the runner was scored a SURVIVOR because of it.
      - name: Mutation battery P1-71
        run: python mutation/mutate_p1_71.py

      - name: Mutation battery P0-67
        run: python mutation/mutate_p0_67.py

      # Session 22 (P1-76). Three of its fourteen mutants SURVIVED on the first run,
      # including the one that reinstates the pre-P1-76 emergent tie-break -- the
      # precedence test was decorative because direct-wins was over-determined.
      - name: Mutation battery P1-76
        run: python mutation/mutate_p1_76.py

      # UI1 (the conformance snapshot). Two of its twelve mutants SURVIVED on the first
      # run against a suite of 21 tests that were all green -- the short-leader path was
      # untested, and the clamp test asserted the FLAG rather than the VERDICT. A third
      # was RETIRED as unkillable by construction rather than weakened; the battery
      # records why, because "make the mutant die" is the wrong instinct when the mutant
      # describes something the platform cannot produce.
      - name: Mutation battery UI1
        run: python mutation/mutate_ui1.py

      # UI2 (one config owner; the window dispatches requests). The FIRST battery here to
      # mutate two files: four of its mutants edit TradeCopierWindow.cs, whose whole body is
      # `#if !TESTING`, so the suite compiles it away and four acceptance tests read it as
      # TEXT instead. Those four mutants put each original defect back verbatim, because
      # "does the source-text check actually fail when the defect returns?" is the one
      # question a source-text check cannot answer about itself.
      - name: Mutation battery UI2
        run: python mutation/mutate_ui2.py

      # UI3 (the guard rule inventory). Every mutant here makes the inventory MORE REASSURING
      # than the truth, because that is the only direction that can hurt anyone: this registry
      # exists to stop a config field lying about whether it protects anything, so "it crashes"
      # is not the failure mode -- "it reports ENFORCING for a rule that has never been able to
      # fire" is. Three survived the first run, all one gap (the evidence count was asserted for
      # 1 of 5 rules that use it); the fix opened an escape route, and the mutant for THAT
      # survived too. Read the file before adding to it.
      - name: Mutation battery UI3
        run: python mutation/mutate_ui3.py

      # UI4 (the producer). UI3's battery proved the REGISTRY honest; this one proves the
      # BUILDER cannot take that honesty back, which is a different job -- every guarantee UI3
      # bought is now mediated by one method. Same asymmetry: every mutant makes the snapshot
      # more reassuring than the box. Three survived the first run and each said something
      # different: a field never observed being false (IsArmed), a fix applied to only one of
      # two identical accessors, and an UNREACHABLE fallback that was deleted rather than
      # pinned -- see the note beside that mutant before adding a defensive branch here.
      - name: Mutation battery UI4
        run: python mutation/mutate_ui4.py

      # UI5 (the JSON contract). Fifteen lines of serializer settings, batteried because the
      # route that serves the payload is UNTESTABLE (P2-27) and the settings are exactly what a
      # future tidy-up would change. Dropping the enum converter couples the page to an enum
      # order that exists for sorting; NullValueHandling.Ignore turns "no limit" into a limit
      # of zero, which is UI1's bare-zero defect one layer out.
      - name: Mutation battery UI5
        run: python mutation/mutate_ui5.py

      # UI6 (the copier half). The mutant this battery exists for casts CopierConformance to an
      # int for sorting: that enum's numbering is HISTORICAL, not severity, so casting puts a
      # healthy Idle row first and an ORPHAN -- a live position nothing is managing -- below a
      # quarantined one. Three survived the first run, all real gaps: an unrecognised verdict was
      # unreachable by the completeness test, and nothing asserted the ACTUAL position or the
      # quarantine reason survived serialization.
      - name: Mutation battery UI6
        run: python mutation/mutate_ui6.py

      # UI7 -- a refusal that says why. Every mutant here still REFUSES the write, so the
      # P1-76 tests stay green through all of them; what breaks is the operator's ability to
      # find out what to change. Two of the ten mutate TradeCopierWindow.cs instead of the
      # engine, putting a surface back on the reason-losing overload -- that file is entirely
      # `#if !TESTING`, so a source scan is the only gate there is and it has to be proven to
      # fire. One survived the first run: the accepted-write test covered the relationship
      # half and not the group half, which is the same one-sided shape as P1-69 and P1-75.
      - name: Mutation battery UI7
        run: python mutation/mutate_ui7.py

      # P1-82 -- a switch whose rule cannot fire must not default ON. The change is four
      # literals, which is precisely why it needs a battery: that is the size of diff that
      # gets half-applied, or reverted later by someone "restoring a sensible default".
      # Each default is stated TWICE -- property initializer and parser fallback -- and the
      # parser copy is the one that runs for every config file that predates the field, i.e.
      # all of them. Mutants 3 and 4 flip only that copy, which the class gate cannot see
      # because it builds its config with `new`. Two control mutants default the two
      # genuinely-enforcing switches OFF, so R2 cannot be satisfied by removing real
      # protection, and two more try to make the gate stop scanning rather than fail.
      - name: Mutation battery P1-82 / P1-86
        run: python mutation/mutate_p182.py

      # P1-85 -- the copier must not invent an account when a request omits one. Most of the
      # interesting ways to get this wrong still LOOK like a refusal, which is what the
      # battery is for: mutant 5 tests for null instead of blank (every test that OMITS an
      # account still passes, because omitted and blank are different inputs -- the review
      # panel found that one, not the suite), mutant 7 refuses without a reason, and mutant 8
      # puts the load-path skip back on Console.WriteLine so config shrinks at startup with
      # nothing in the guard log to say so.
      - name: Mutation battery P1-85
        run: python mutation/mutate_p185.py

      # P1-84 -- three defaults that made the guard easier to switch off than to live with.
      # A battery over three literals looks like overkill until you notice that none of the
      # tests pins a number: one asserts an inequality between two files, one is conditional
      # on a neighbouring field, one reads the addon source. Mutant 6 raises the copier cap
      # to ONE above the guard's, which is what proves the first is an inequality and not a
      # pinned 10. Mutant 3 -- changing OnMissing to AutoStop -- SURVIVED the first run
      # against 1180 green tests, and that survival is how P1-87 was found.
      - name: Mutation battery P1-84
        run: python mutation/mutate_p184.py

      # P1-83 -- config that is stored, settable, and read by nothing. The gate is a class
      # gate: it walks the two copier DTOs by reflection and counts real uses in the ENGINE,
      # excluding the declaration, `X = something.X` clone/serialize lines, and the
      # field-name string list. Scoping it to the engine is the whole design -- scanning the
      # window too would score StealthMode as READ, because the window printed "Stealth: ON"
      # for a feature with no implementation, which is the worst form of the defect rather
      # than an absolution from it. Mutant 4 reintroduces a field WITH a fake read, which is
      # the cheapest way to satisfy any "is it referenced?" check.
      - name: Mutation battery P1-83
        run: python mutation/mutate_p183.py

      # P1-87 -- an unrecognised StopGuard.OnMissing emitted NO ACTION for a position with no
      # stop. Found by mutate_p184's OnMissing mutant SURVIVING 1180 green tests, and a test
      # in that suite ASSERTED the defect as correct behaviour, so the suite was defending it
      # rather than merely silent about it. Mutant 2 is the one to know: it keeps the else
      # branch and makes it do nothing, so the shape of the fix survives and the behaviour
      # does not -- a reviewer skimming the diff sees an else and moves on.
      - name: Mutation battery P1-87
        run: python mutation/mutate_p187.py

# Plan section 6 also lists deploy parity (tools/sync_nt8.py --verify). It is NOT run
# here: it compares against %USERPROFILE%/Documents/NinjaTrader 8/, which exists only on
# the trading machine. A hosted runner has no NT8 install, so the check would either be
# skipped or pass vacuously -- and a green check that proves nothing is worse than an
# absent one. Run it locally before and after every deploy.
